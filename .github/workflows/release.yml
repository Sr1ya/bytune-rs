# Builds ByTune installers for Linux, Windows and macOS.
#
#   push a tag like v0.1.0   → builds everything and attaches it to a draft GitHub release
#   Actions → Release → Run  → builds everything; installers are kept as workflow artifacts
#
# The fallback stream helper (rustypipe-botguard) ships as a Tauri sidecar named after each target;
# it is compiled once per target and cached, since it embeds V8 and takes a while.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  BOTGUARD_VERSION: 0.1.2

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Restore the botguard sidecar
        id: botguard
        uses: actions/cache@v4
        with:
          path: botguard-bin
          key: botguard-${{ env.BOTGUARD_VERSION }}-${{ matrix.target }}

      - name: Build the botguard sidecar
        if: steps.botguard.outputs.cache-hit != 'true'
        run: cargo install rustypipe-botguard --version ${{ env.BOTGUARD_VERSION }} --locked --target ${{ matrix.target }} --root botguard-bin

      - name: Place the sidecar
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir -p src-tauri/binaries
          cp "botguard-bin/bin/rustypipe-botguard$ext" "src-tauri/binaries/rustypipe-botguard-${{ matrix.target }}$ext"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # Only a tag publishes a (draft) release; a manual run just builds.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ByTune ${{ github.ref_name }}
          releaseBody: Installers for Linux, Windows and macOS. The builds are not code-signed.
          releaseDraft: true
          prerelease: false

      - name: Keep the installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bytune-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
