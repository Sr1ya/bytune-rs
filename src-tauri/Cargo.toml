[package]
name = "bytune"
version = "0.1.0"
description = "ByTune — desktop music player for Linux, Windows and macOS (Tauri + Rust)"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[lib]
name = "bytune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli"] }
rustypipe = { version = "0.11.4", default-features = false, features = ["rustls-tls-native-roots"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
lofty = "0.25"
walkdir = "2"
sha1 = "0.10"
hex = "0.4"
regex = "1"
once_cell = "1"
unicode-normalization = "0.1"
urlencoding = "2"
url = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
